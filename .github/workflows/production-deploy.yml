name: Release gate

# Winstone Connect is deployed by Lovable's own publish mechanism, which is not
# callable from GitHub Actions. This workflow therefore does NOT deploy — it is
# the release gate that must be green before anyone publishes:
#
#   install -> typecheck -> build -> tests -> smoke test
#
# scripts/smoke.mjs exits non-zero on any failed check, so a red run here means
# "do not publish". The documented release process is:
#
#   1. Merge to main and wait for this workflow to pass.
#   2. Publish from the Lovable editor (Publish button).
#   3. Re-run the "Post-publish verification" job below against the live site
#      (Actions -> Release gate -> Run workflow -> target: production), which
#      smoke-tests the deployed URL and fails if the release is broken.
#
# Set the repository variable PRODUCTION_URL (e.g. https://crm-v2.winstonebd.com)
# to enable step 3. No credentials are needed and none are stored here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "What to smoke-test"
        type: choice
        default: repository
        options:
          - repository # build this commit and smoke-test it locally
          - production # smoke-test the already published site at PRODUCTION_URL

jobs:
  verify:
    name: Build, typecheck and smoke test
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'repository'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test

      - name: Start built app
        run: |
          bun run preview --port 8080 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "App did not start" >&2
          exit 1

      - name: Smoke test (this commit)
        env:
          SMOKE_BASE_URL: http://localhost:8080
        run: node scripts/smoke.mjs

      - name: Release gate result
        run: echo "Gate passed. Publishing is done from the Lovable editor; do not publish a red commit."

  post-publish:
    name: Post-publish verification
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke test (live site)
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL }}
          # Never silently fall back to localhost when the live site is the target.
          SMOKE_REQUIRE_BASE_URL: "1"
        run: node scripts/smoke.mjs
