name: Verify and publish

# Release gate for Winstone Connect.
#
# The `verify` job is the gate: install -> typecheck -> build -> tests -> smoke
# test. `scripts/smoke.mjs` exits non-zero on any failed check, which fails the
# job, and `publish` declares `needs: verify`, so a failed smoke test means the
# publish job never runs.
#
# This repository is deployed by Lovable's own publish mechanism. There is no
# deploy CLI in the repo, so the publish job only does something when a deploy
# hook is configured as a secret; without one it fails loudly rather than
# pretending a deployment happened.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Build, typecheck and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test

      - name: Start built app
        if: vars.SMOKE_BASE_URL == ''
        run: |
          bun run preview --port 8080 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "App did not start" >&2
          exit 1

      - name: Smoke test
        env:
          # Set the SMOKE_BASE_URL repository variable to test a deployed
          # candidate instead of the locally built app.
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: node scripts/smoke.mjs

  publish:
    name: Publish to production
    needs: verify # a failed verify job — including the smoke test — skips this job entirely
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Credentials live in repository/environment secrets only, never in the repo.
      - name: Trigger Lovable publish
        env:
          LOVABLE_DEPLOY_HOOK: ${{ secrets.LOVABLE_DEPLOY_HOOK }}
        run: |
          if [ -z "$LOVABLE_DEPLOY_HOOK" ]; then
            echo "::error::No LOVABLE_DEPLOY_HOOK secret configured. This repository is published"
            echo "::error::from the Lovable editor; add the deploy hook secret to automate it, or"
            echo "::error::disable this job and publish manually after the verify job passes."
            exit 1
          fi
          curl -fsS -X POST "$LOVABLE_DEPLOY_HOOK"

      - name: Post-publish smoke test
        if: vars.PRODUCTION_URL != ''
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          bun install --frozen-lockfile
          node scripts/smoke.mjs
