name: Android APK

# Builds the real, signed Winstone Connect Android APK from the android/
# folder in this repository. The Lovable editor sandbox has no Java/Gradle
# toolchain, so the APK is built here on GitHub's runners instead.
#
# What you get from each run (Actions -> Android APK -> the run):
#   - Artifact "winstone-connect-apk": the signed release APK + its SHA-256
#   - On version tags (v*): a GitHub Release with APK + checksum attached
#
# The signing key (android/winstone-release.jks) and its passwords are already
# in the repo by design (project-internal distribution key), so every build
# keeps the same signature and agents can update without uninstalling.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK and compute SHA-256
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NAME="winstone-connect-v${VERSION}-${CODE}.apk"
          cp "$APK" "out/${NAME}"
          (cd out && sha256sum "${NAME}" | tee "${NAME}.sha256")
          echo "apk_name=${NAME}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: winstone-connect-apk
          path: android/out/
          if-no-files-found: error

      - name: Create GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/*
          generate_release_notes: true
